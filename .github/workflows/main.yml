name: Dynamic Link Draft Video Engine Production
on:
  workflow_dispatch:
    inputs:
      input_video_url:
        description: 'Target YouTube Video Link Source Input Stream'
        required: true
        default: 'https://youtu.be/vTLfOqEolsk?si=fIKWGyN929W-_87u'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-upload-draft-matrix:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Configure Python Environment Framework
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Upgraded to resolve deprecation warnings

    - name: Install System Dependencies and Media Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install pytube google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Execute Manual Link Pipeline Engine
      env:
        YOUTUBE_API_SECRET: ${{ secrets.YOUTUBE_API_SECRET }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        USER_VIDEO_LINK: ${{ github.event.inputs.input_video_url }}
      run: python app.py
