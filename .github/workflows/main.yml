name: Daily Upload Run

on:
  schedule:
    - cron: '*/45 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Bot
      env:
        YOUTUBE_API_SECRET: ${{ secrets.YOUTUBE_API_SECRET }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: |
        echo "$YOUTUBE_API_SECRET" > googleAPI.json
        echo "$YOUTUBE_TOKEN" > token.json
        python botTuber.py -a || exit 0
