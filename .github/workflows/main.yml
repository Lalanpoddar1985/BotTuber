name: Permanent Channel Source Video Bot
on:
  schedule:
    - cron: '0 */4 * * *' # Executes autonomously every 4 hours (6 times a day)
  workflow_dispatch: # Allows immediate manual overrides via the "Run workflow" button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Prevents OS/Node framework deprecation logs

jobs:
  run-autonomous-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Configure Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies and Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install yt-dlp openai google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Execute Video Master Engine
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        YOUTUBE_API_SECRET: ${{ secrets.YOUTUBE_API_SECRET }}
        YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
      run: python app.py
